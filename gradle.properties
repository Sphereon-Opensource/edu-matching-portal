#Gradle
org.gradle.jvmargs=-Xmx12092M -XX:+UseZGC -XX:+ZGenerational -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx8192M -XX:+UseZGC -XX:+ZGenerational -XX:MaxMetaspaceSize=1536m -XX:ReservedCodeCacheSize=320m
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
kotlin.incremental=true
kotlin.stdlib.default.dependency=true
kotlin.version=2.3.20-RC2
kotlinLanguageVersion=2.2
kotlinx.atomicfu.enableJvmIrTransformation=true
#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir
kotlin.native.memoryModel=experimental

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
force.legacy.variant.api=true
ksp.useKSP2=true
kotlin.native.enableKlibsCrossCompilation=false
kotlin.js.yarn=false
version=0.1.0-SNAPSHOT
gbsVersion=0.8.0-SNAPSHOT

#Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
