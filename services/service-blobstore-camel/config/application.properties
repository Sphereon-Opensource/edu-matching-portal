# service-blobstore-camel default configuration

# ── Local filesystem store ───────────────────────────────────────────────────
blob.stores.local.type=filesystem
blob.stores.local.scopebinding=TENANT
blob.stores.local.rootDir=./blobs
blob.stores.local.autoCreateDirs=true

# ── Azure blob store ─────────────────────────────────────────────────────────
blob.stores.azure.type=camel-azure-blob
blob.stores.azure.accountName=kw1csurf
blob.stores.azure.containerName=test
blob.stores.azure.scopebinding=TENANT
blob.stores.azure.sasToken=${env:AZURE_BLOB_SAS_TOKEN}

# ── Portal catalog ───────────────────────────────────────────────────────────
portal.blob.catalog.defaultStoreId=local

# Per-store catalog overrides (label, order, readonly)
portal.blob.catalog.store.local.label=Local Storage
portal.blob.catalog.store.local.readonly=false
portal.blob.catalog.store.local.order=1
portal.blob.catalog.store.azure.label=Azure Cloud
portal.blob.catalog.store.azure.order=2
